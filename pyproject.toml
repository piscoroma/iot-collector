[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "iot-collector"
version = "0.1.0"
description = "IoT sensor data collector and Prometheus exporter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "prometheus-client>=0.21,<1.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "httpx2",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
]

[project.scripts]
iot-collector = "iot_collector.main:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"


[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"